<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Cell Table</title>
    <style>
        table {
            border-collapse: collapse; 
            width: 80%;               
            margin: 20px auto;        
        }
        td {
            border: 1px solid black; 
            padding: 40px;            
            font-size: 18px;
        }
        .first {
            background-color: #c5d58e; 
        }
        .second {
            background-color: #f4b8a5; 
        }
    </style>
</head>
<body>
    
    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>
</body>
</html>
